<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 手機/電腦萬用下載器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.min.css">
    <style>
        body { padding-top: 50px; background-color: #f4f5f6; }
        .container { max-width: 600px; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .status { margin: 20px 0; font-weight: bold; padding: 10px; border-radius: 5px; display: none; }
        .loading { background-color: #fff3cd; color: #856404; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .btn-mp3 { background-color: #4CAF50; border-color: #4CAF50; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎬 YouTube 萬用下載器</h2>
        <p>貼上連結，即可直接下載影片至手機相簿或檔案中。</p>
        
        <label for="url">YouTube 影片網址：</label>
        <input type="url" id="url" placeholder="https://www.youtube.com/watch?v=...">
        
        <div id="statusBox" class="status"></div>
        
        <div class="row">
            <div class="column">
                <button class="button-primary" onclick="startDownload('mp4')">🎬 下載 MP4 影片</button>
            </div>
            <div class="column">
                <button class="button btn-mp3" onclick="startDownload('mp3')">🎵 轉為 MP3 音訊</button>
            </div>
        </div>
    </div>

    <script>
        function startDownload(type) {
            const url = document.getElementById('url').value;
            const statusBox = document.getElementById('statusBox');
            
            if(!url) {
                alert('請先輸入網址！');
                return;
            }

            // 顯示下載中狀態
            statusBox.className = "status loading";
            statusBox.innerText = "⏳ 伺服器正在解析並下載影音，請稍候（高畫質可能需要 1~2 分鐘）...";
            statusBox.style.display = "block";

            // 發送請求給 Flask 後端
            fetch('/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url, type: type })
            })
            瀏覽器回應處理
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    statusBox.className = "status success";
                    statusBox.innerText = "🎉 伺服器處理完成！正在為您下載到手機...";
                    // 自動觸發瀏覽器下載實體檔案
                    window.location.href = data.download_url;
                } else {
                    statusBox.className = "status error";
                    statusBox.innerText = "❌ 發生錯誤：" + data.error;
                }
            })
            .catch(err => {
                statusBox.className = "status error";
                statusBox.innerText = "❌ 連線失敗，請檢查網路。";
            });
        }
    </script>
</body>
</html>
